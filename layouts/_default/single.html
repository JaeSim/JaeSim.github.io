{{ define "main" }}
<article class="markdown book-post">
  <h1 style="font-weight: bold;">
    <span style="font-weight: normal; font-size: 0.6em; color: #888;">
      {{ .Date.Format "2006-01-02 15:04 MST" }}
    </span>
  </h1>
  <div class="book-post-content">
    {{- .Content -}}
  </div>
</article>
{{ end }}

{{ define "toc" }}
  {{ partial "docs/toc" . }}
{{ end }}
